name: casecite-goodmem
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      CASECITE_DB_PASSWORD: ${CASECITE_DB_PASSWORD:?Set CASECITE_DB_PASSWORD in .env}
      GOODMEM_DB_PASSWORD: ${GOODMEM_DB_PASSWORD:?Set GOODMEM_DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
      - ./deploy/init-databases.sh:/docker-entrypoint-initdb.d/10-casecite.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  goodmem:
    image: ${GOODMEM_IMAGE:-ghcr.io/pair-systems-inc/goodmem/server@sha256:162b02ebefae8c84db2e00856ead6c7d6e465d5afb8e6d68d5cc8e063b61a53b}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/goodmem
      DB_USER: goodmem
      DB_PASSWORD: ${GOODMEM_DB_PASSWORD}
      GOODMEM_TLS_DISABLED: 'true'
      GOODMEM_OCR_BASE_URL: ${GOODMEM_OCR_BASE_URL:-http://host.docker.internal:8001/v1}
      JAVA_TOOL_OPTIONS: -Xmx2g
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
  setup:
    build: .
    profiles: [setup]
    command: [setup-goodmem, /data/goodmem.json]
    environment:
      GOODMEM_BASE_URL: http://goodmem:8080
      GOODMEM_INITIALIZE: 'true'
      GOODMEM_EMBEDDER_ID: ${GOODMEM_EMBEDDER_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    volumes:
      - connection:/data
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      goodmem:
        condition: service_started
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000'
    environment:
      DATABASE_URL: postgres://casecite:${CASECITE_DB_PASSWORD}@postgres:5432/casecite?sslmode=disable
      GOODMEM_CONFIG_FILE: /data/goodmem.json
      GOODMEM_BASE_URL: http://goodmem:8080
      GOODMEM_RERANKER_ID: ${GOODMEM_RERANKER_ID:-}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      REGISTRATION_BOOTSTRAP_TOKEN: ${REGISTRATION_BOOTSTRAP_TOKEN:?Set REGISTRATION_BOOTSTRAP_TOKEN in .env}
      DEBUG: ${DEBUG:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-5.5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      HIPAA_ENFORCEMENT_ENABLED: ${HIPAA_ENFORCEMENT_ENABLED:-false}
      APPROVED_AI_PROVIDERS: ${APPROVED_AI_PROVIDERS:-}
      OPENAI_UTILITY_MODEL: ${OPENAI_UTILITY_MODEL:-gpt-5.4-mini}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-3600}
      REVIEW_TABLE_CONCURRENCY: ${REVIEW_TABLE_CONCURRENCY:-4}
      REQUIRE_MFA: ${REQUIRE_MFA:-false}
      AUDIT_FAIL_CLOSED: ${AUDIT_FAIL_CLOSED:-false}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      GOOGLE_APP_ID: ${GOOGLE_APP_ID:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_CONNECTOR_REDIRECT_URI: ${MICROSOFT_CONNECTOR_REDIRECT_URI:-}
      BOX_CLIENT_ID: ${BOX_CLIENT_ID:-}
      BOX_CLIENT_SECRET: ${BOX_CLIENT_SECRET:-}
      BOX_REDIRECT_URI: ${BOX_REDIRECT_URI:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      DROPBOX_REDIRECT_URI: ${DROPBOX_REDIRECT_URI:-}
      CLIO_CLIENT_ID: ${CLIO_CLIENT_ID:-}
      CLIO_CLIENT_SECRET: ${CLIO_CLIENT_SECRET:-}
      CLIO_BASE_URL: ${CLIO_BASE_URL:-https://app.clio.com}
      CLIO_REDIRECT_URI: ${CLIO_REDIRECT_URI:-}
      FILEVINE_ENABLED: ${FILEVINE_ENABLED:-false}
      FILEVINE_API_KEY: ${FILEVINE_API_KEY:-}
      FILEVINE_API_SECRET: ${FILEVINE_API_SECRET:-}
      FILEVINE_BASE_URL: ${FILEVINE_BASE_URL:-https://api.filevine.io}
      EXPERIMENTAL_CONNECTORS: ${EXPERIMENTAL_CONNECTORS:-false}
      NETDOCUMENTS_CLIENT_ID: ${NETDOCUMENTS_CLIENT_ID:-}
      NETDOCUMENTS_CLIENT_SECRET: ${NETDOCUMENTS_CLIENT_SECRET:-}
      NETDOCUMENTS_VAULT_HOST: ${NETDOCUMENTS_VAULT_HOST:-https://vault.netvoyage.com}
      NETDOCUMENTS_API_HOST: ${NETDOCUMENTS_API_HOST:-https://api.vault.netvoyage.com}
      NETDOCUMENTS_REDIRECT_URI: ${NETDOCUMENTS_REDIRECT_URI:-}
      IMANAGE_CLIENT_ID: ${IMANAGE_CLIENT_ID:-}
      IMANAGE_CLIENT_SECRET: ${IMANAGE_CLIENT_SECRET:-}
      IMANAGE_BASE_URL: ${IMANAGE_BASE_URL:-https://cloudimanage.com}
      IMANAGE_REDIRECT_URI: ${IMANAGE_REDIRECT_URI:-}
      AZURE_SSO_AUTO_PROVISION: ${AZURE_SSO_AUTO_PROVISION:-true}
      AZURE_SSO_DEFAULT_ROLE: ${AZURE_SSO_DEFAULT_ROLE:-viewer}
      ADDIN_ALLOWED_ORIGINS: ${ADDIN_ALLOWED_ORIGINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      COURTLISTENER_API_TOKEN: ${COURTLISTENER_API_TOKEN:-}
      COURTLISTENER_BASE_URL: ${COURTLISTENER_BASE_URL:-https://www.courtlistener.com/api/rest/v4}
      WORKFLOW_MAX_STEPS: ${WORKFLOW_MAX_STEPS:-12}
      WORKFLOW_MAX_DOCUMENTS_PER_STEP: ${WORKFLOW_MAX_DOCUMENTS_PER_STEP:-25}
      WORKFLOW_MAX_CITATIONS_PER_STEP: ${WORKFLOW_MAX_CITATIONS_PER_STEP:-10}
      WORKFLOW_MAX_OUTPUT_BYTES: ${WORKFLOW_MAX_OUTPUT_BYTES:-524288}
      WORKFLOW_NOTIFICATIONS: ${WORKFLOW_NOTIFICATIONS:-false}
      DEEP_RESEARCH_MAX_SUBQUESTIONS: ${DEEP_RESEARCH_MAX_SUBQUESTIONS:-8}
      DEEP_RESEARCH_MAX_TOOL_CALLS: ${DEEP_RESEARCH_MAX_TOOL_CALLS:-24}
      DEEP_RESEARCH_MAX_PASSAGES: ${DEEP_RESEARCH_MAX_PASSAGES:-60}
      DEEP_RESEARCH_CONCURRENCY: ${DEEP_RESEARCH_CONCURRENCY:-3}
      DEEP_RESEARCH_FOLLOWUP_DEPTH: ${DEEP_RESEARCH_FOLLOWUP_DEPTH:-1}
      RESEARCH_MAX_WINDOWS_PER_OPINION: ${RESEARCH_MAX_WINDOWS_PER_OPINION:-6}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    volumes:
      - connection:/data:ro
    restart: unless-stopped
volumes:
  database:
  connection:
