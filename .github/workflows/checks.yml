name: Go and browser checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: casecite_test
        ports: ['5432:5432']
        options: --health-cmd='pg_isready -U postgres' --health-interval=3s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go vet ./... && go test -race ./...
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:integration-only@localhost:5432/casecite_test?sslmode=disable
      - run: npm ci --ignore-scripts && npm run build && npm audit --omit=dev
        working-directory: frontend
      - run: bash scripts/build.sh
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/integration.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: browser-test-results
          path: frontend/test-results/
